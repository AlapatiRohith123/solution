schema_version = "1.3"
runtime_limits = 14400


[task]
name = "otter/mars-evolved-gas-spectra-detection"
description = "Mars Evolved-Gas Spectra: Multi-Label Compound Detection From Commercial Instruments to the SAM Testbed."

[metadata]
domain = "tabular-ml"
subdomain = "classification"
tags = ["real-ml", "tabular-ml", "classification", "mars-spectrometry", "multi-label"]
source_dataset = "NASA Mars Spectrometry EGA-MS (DrivenData 2022)"
source_url = "https://registry.opendata.aws/nasa-ega/"
source_reference_id = "ott-abfn-eejw"
source_license = "NASA open data"

[environment]
build_timeout_sec = 1200.0
workdir = "/app"
os = "linux"
cpus = 4
memory_mb = 16384
storage_mb = 40960
# 0 for CPU-only tasks. Set to 1 for GPU tasks (single-GPU max — tasks are
# validated in single-container, single-GPU sandboxes) and switch
# environment/Dockerfile to a CUDA base image (see comments there).
gpus = 1
gpu_types = ["T4", "A100"]
allow_internet = true

[agent]
timeout_sec = 14400.0

[verifier]
timeout_sec = 900.0
