schema_version = "1.3"
runtime_limits = 14400

[task]
name = "otter/opssat-ad"
description = "CubeSat Multi-Channel Telemetry Stream Anomaly Detection on Real ESA OPS-SAT Data With Semi-Supervised Labels (OPSSAT-AD)"

[metadata]
domain = "tabular-ml"
subdomain = "anomaly-detection"
tags = ["anomaly-detection", "time-series", "deep-learning", "pytorch", "cubesat", "distribution-shift"]
source_dataset = "OPSSAT-AD"
source_url = "https://zenodo.org/records/12588359"
source_reference_id = "10.5281/zenodo.12588359"
source_license = "CC BY 4.0"

[environment]
build_timeout_sec = 2400.0
workdir = "/app"
os = "linux"
cpus = 4
memory_mb = 16384
storage_mb = 10240
gpus = 1
gpu_types = ["L4", "A100", "T4"]
allow_internet = true

[agent]
timeout_sec = 14400.0

[verifier]
timeout_sec = 600.0
