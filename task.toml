schema_version = "1.3"
runtime_limits = 14400

[task]
name = "otter/play-dialogue-classifier"
description = "Build a compact general-purpose trainer for dialogue-line play classification."

[metadata]
domain = "nlp"
subdomain = "information-extraction"
tags = ["pytorch", "onnx", "reproducible-training", "robustness"]
source_dataset = "Collected plays by William Shakespeare and Henrik Ibsen"
source_url = "https://www.gutenberg.org/"
source_reference_id = "Project Gutenberg ebook 100 and Ibsen volumes 1-11"
source_license = "CC0 1.0"

[metadata.network]
enabled = true
policy = "internet_allowed_with_blacklist"
blacklist_file = "network_blacklist.txt"

[environment]
build_timeout_sec = 1200.0
workdir = "/app"
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 16384
gpus = 1
gpu_types = ["L4"]
allow_internet = true

[agent]
timeout_sec = 14400.0

[verifier]
timeout_sec = 3600.0
