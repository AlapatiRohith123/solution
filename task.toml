schema_version = "1.3"
runtime_limits = 14400

[task]
name = "otter/opssat-ad"
description = "CubeSat Telemetry Fragment Anomaly Detection With 10% Labels on Held-Out Channels (OPS-SAT-AD)"

[metadata]
domain = "tabular-ml"
subdomain = "anomaly-detection"
tags = ["anomaly-detection", "tabular", "space", "ops-sat", "distribution-shift"]
source_dataset = "OPSSAT-AD"
source_url = "https://zenodo.org/records/12588359"
source_reference_id = "10.5281/zenodo.12588359"
source_license = "CC BY 4.0"

[environment]
build_timeout_sec = 1200.0
workdir = "/app"
os = "linux"
cpus = 4
memory_mb = 16384
storage_mb = 10240
gpus = 1
gpu_types = ["L4", "A100", "T4"]
allow_internet = true

[agent]
timeout_sec = 14400.0

[verifier]
timeout_sec = 600.0
