schema_version = "1.3"
runtime_limits = 14400


[task]
name = "otter/codex-linkpred"
description = """We're deciding whether the entity-graph prototype gets a graph model at all, so I need a proper link prediction baseline on CoDEx-M, with two model families measured the same way so they're comparable.

Data's in /app/data. The graph lives in /app/data/kg: train.tsv, valid.tsv, entities.tsv with names and types, and relations.tsv. What gets scored is /app/data/lp/eval_queries.tsv, where each row is one side of a triple plus the relation, and `target` says which side is missing. /app/data/lp/val_answers.tsv answers part of that set so you can measure yourself; the rest are held back, and every query still needs a prediction.

Two models trained on the training triples: TransE, and something in the R-GCN family with real per-relation transforms. A plain GCN over the untyped graph isn't what we're after. For every eval query, rank your best 20 candidates best-first over the full entity set. Leave out the other entities the data you already have marks as a true answer to that query, but keep the answer being scored itself in the list. For the queries answered in val_answers.tsv that means the answer stays and only the other known-true entities come out, which is exactly how we score it. Scoring is filtered MRR and Hits@1/3/10, with anything past your 20 counted as a miss.

I also want the per-relation view: MRR and Hits@10 by relation for each model, over the relations with enough validation queries to be stable, which relation comes out hardest and which easiest, and how that tracks the amount of training data each one has (Spearman across those relations). Then at least 300 words in /app/reports/report.md covering the models, the numbers you measured, which relations came out hard and easy, and the caveats.

Two things worth knowing up front. Every number you report has to be derivable from the prediction files you save, since we recompute from those, so metrics read off a training log won't match. And save the embeddings, at least 32 dimensions wide, so your rankings can be reproduced from them with the usual scoring rule for each model (translation distance for TransE, DistMult over the encoder output for the R-GCN), rows in the same order as entities.tsv and relations.tsv. The upstream copy of this graph is public, so don't go pulling it in to fill in held-out answers. It shows up in the numbers: the held-out queries and the answered ones are the same kind of question drawn the same way, so we compare how you do on each, and a model that is markedly stronger on the half it cannot see is not a model that generalises. Scoring far better on the graded half than on the half you can measure yourself fails, and so does writing the answers you were given straight into the ranking for the half you can measure.

The R-GCN has to be a real encoder rather than a decoder wearing the name, and the way we confirm that is by re-running your encoder ourselves from the parameters you save. Two things have to hold. Re-running it has to land back on the entity embeddings you saved, and re-running it with the neighbour messages switched off has to move the answer by at least a hundredth of its norm. An encoder whose answer barely changes when you take the graph away is a decoder with an encoder bolted on, and it will not pass. How you build the encoder is yours to decide, but we can only re-run what you hand us, so the file layout and the propagation variants we know how to replay are written out in /app/data/encoder_protocol.md. Read it before you settle on a design.

What we read:

```
/app/artifacts/kg_stats.json           n_entities, n_relations, n_train_triples, relation_counts, entity_type_counts
/app/artifacts/embeddings/             transe_entity.npy, rgcn_entity.npy in entities.tsv row order;
                                       transe_relation.npy, rgcn_relation.npy in relations.tsv row order;
                                       rgcn_input.npy, the encoder's input entity embeddings, entities.tsv row order
/app/artifacts/encoder/                the per-layer encoder parameters, named and shaped as set out in
                                       /app/data/encoder_protocol.md
/app/artifacts/predictions/            lp_transe.csv and lp_rgcn.csv as query_id,ranked_entities (pipe separated, best first)
/app/artifacts/lp_results.json         per model: mrr, hits@1, hits@3, hits@10, plus per_relation with mrr and hits@10
/app/artifacts/relation_analysis.json  per_relation with n_queries, train_triples, mrr_transe, mrr_rgcn, mrr_mean,
                                       hits10_transe, hits10_rgcn; then hardest_relation, easiest_relation,
                                       frequency_mrr_correlation
/app/artifacts/model_config.json       a transe and an rgcn block, each naming at least three settings
                                       you actually ran for that model; the rgcn block says how many
                                       layers and how many bases, matching what you saved, and the
                                       scoring rule each block names has to be the one your rankings
                                       actually come from
/app/artifacts/metrics.json            transe_mrr, rgcn_mrr, transe_hits10
/app/reports/report.md
```

Everything in those files is measured on the labelled validation slice, filtered with the triples you can see. The per-relation breakdown and the analysis cover the relations that have at least 30 validation queries; mrr_mean is the mean of your two models' MRRs for that relation.

There is a bar, and all three parts of it have to clear together: transe_mrr at least 0.21, rgcn_mrr at least 0.085, and transe_hits10 at least 0.35. We recompute those three on the graded half from the prediction files you save. The same three keys in your own metrics.json are your measurement on the answered half, so read them as where you stand rather than as the thing being marked; the two halves are drawn the same way, so they normally land close together."""

[metadata]
domain = "graph-learning"
subdomain = "edge-prediction"
tags = ["knowledge-graph-embedding", "link-prediction", "transe", "r-gcn", "wikidata"]
source_dataset = "CoDEx-M knowledge graph completion benchmark (github.com/tsafavi/codex), official train/valid/test splits; entities and relations derived from Wikidata"
source_url = "https://github.com/tsafavi/codex"
source_reference_id = "arxiv:2009.07810"
source_license = "MIT"

[environment]
build_timeout_sec = 3600.0
workdir = "/app"
os = "linux"
cpus = 8
memory_mb = 32768
storage_mb = 81920
gpus = 1
gpu_types = ["A100"]
allow_internet = true

[agent]
timeout_sec = 14400.0

[verifier]
timeout_sec = 900.0
